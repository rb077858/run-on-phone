<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חיבור וואטסאפ</title>
<style>
  :root { --bg:#14111f; --card:#1f1a30; --line:#342b4f; --text:#f1eefb; --muted:#a59dc2; --accent:#f6c343; --ok:#4cd28a; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { max-width:460px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; text-align:center; }
  h1 { font-size:20px; margin:4px 0 12px; }
  #qr { width:280px; max-width:100%; background:#fff; border-radius:12px; padding:8px; }
  .code { font:700 32px/1.2 ui-monospace, monospace; letter-spacing:3px; color:var(--accent); direction:ltr; margin:10px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .ok { color:var(--ok); font-size:18px; font-weight:700; }
  .err { color:var(--bad); font-size:14px; }
  input { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:#151125; color:var(--text); font-size:16px; direction:ltr; text-align:center; margin-bottom:8px; }
  button, a.btn { border:0; border-radius:10px; padding:10px 14px; font-size:15px; font-weight:600; cursor:pointer; background:#3a3060; color:var(--text); text-decoration:none; display:inline-block; }
  .primary { background:var(--accent) !important; color:#1b1530 !important; }
  ol { text-align:right; padding-right:20px; margin:8px 0; }
</style>
</head>
<body>
<main>
  <h1 id="title">חיבור וואטסאפ</h1>
  <div class="card" id="box">טוען…</div>
  <div class="card" id="pairBox" style="display:none">
    <b>או: חיבור עם קוד (בלי לסרוק)</b>
    <div class="muted" style="margin:6px 0">בוואטסאפ: מכשירים מקושרים ← קישור מכשיר ← קישור עם מספר טלפון במקום זאת</div>
    <input id="phone" placeholder="972501234567" inputmode="tel">
    <button class="primary" onclick="pair()">קבלת קוד</button>
    <div class="code" id="code"></div>
  </div>
  <div style="text-align:center"><a class="btn" href="/admin">← חזרה לממשק הניהול</a></div>
</main>
<script>
const id = location.pathname === '/qr' ? 'manager' : location.pathname.split('/').pop();
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
let phoneSet = false;

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'שגיאה');
  return d;
}

async function pair() {
  $('code').textContent = 'מבקש קוד…';
  try { await post(`/api/session/${id}/pair`, { phone: $('phone').value }); }
  catch (e) { $('code').textContent = ''; alert(e.message); }
}

async function logoutManager() {
  if (!confirm('לנתק את הוואטסאפ של המנהל מהבוט?')) return;
  await post('/api/session/manager/logout');
}

async function refresh() {
  let s;
  try { s = await (await fetch(`/api/session/${id}`)).json(); } catch { return; }
  if (s.error && !s.state) { $('box').innerHTML = `<div class="err">${esc(s.error)}</div>`; return; }
  $('title').textContent = id === 'manager' ? 'חיבור וואטסאפ מנהל' : `חיבור וואטסאפ: ${s.title}`;
  if (!phoneSet && s.phone) { $('phone').value = s.phone; $('phone').readOnly = true; phoneSet = true; }
  const err = s.error ? `<div class="err">${esc(s.error)}</div>` : '';
  if (s.state === 'open') {
    $('pairBox').style.display = 'none';
    $('box').innerHTML = `<div class="ok">✅ מחובר</div><div dir="ltr">+${esc(s.number)}</div>${err}
      <div class="muted" style="margin-top:8px">${id === 'manager'
        ? 'בקבוצה "קופה ראשית מנהל" אפשר לשלוח פרקים.'
        : 'הקבוצה "קופה ראשית פרקים" נוצרה בוואטסאפ של הלקוח. עכשיו אפשר לסנכרן מממשק הניהול.'}</div>
      ${id === 'manager' ? '<p><button onclick="logoutManager()">ניתוק</button></p>' : ''}`;
  } else if (s.state === 'qr') {
    $('pairBox').style.display = '';
    $('code').textContent = s.pairingCode || '';
    $('box').innerHTML = `<img id="qr" src="${s.qr}" alt="QR">
      <ol class="muted"><li>פותחים וואטסאפ ${id === 'manager' ? '' : 'בטלפון של הלקוח'}</li><li>הגדרות ← מכשירים מקושרים ← קישור מכשיר</li><li>סורקים את הקוד</li></ol>${err}`;
  } else {
    $('box').innerHTML = `<div>⏳ ${s.linked ? 'מתחבר…' : 'מכין קוד QR…'}</div>${err}
      ${s.state === 'closed' || s.state === 'loggedOut' ? '<p><button class="primary" onclick="start()">התחברות</button></p>' : ''}`;
  }
}

async function start() { await post(`/api/session/${id}/start`).catch((e) => alert(e.message)); refresh(); }

start();
setInterval(refresh, 2000);
</script>
</body>
</html>
